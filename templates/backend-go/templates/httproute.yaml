{{- if and .Values.httproute .Values.httproute.enabled }}
{{- $global := include "backend-go.globalDefaults" . | fromYaml }}
{{- $route := mergeOverwrite (deepCopy (dig "httproute" dict $global)) .Values.httproute }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "backend-go.fullname" . }}
  labels:
    {{- include "backend-go.labels" . | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $route.rules | default (list (dict "path" (dict "value" "/"))) }}
    - matches:
        - path:
            type: {{ .path.type | default "PathPrefix" }}
            value: {{ .path.value }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "backend-go.fullname" $ }}
          port: {{ $.Values.service.api.port }}
    {{- end }}
{{- end }}
