{{- if and .Values.clientSettings .Values.clientSettings.enabled }}
{{- $global := include "backend-go.globalDefaults" . | fromYaml }}
{{- $settings := mergeOverwrite (deepCopy (dig "clientSettings" dict $global)) .Values.clientSettings }}
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: {{ include "backend-go.fullname" . }}-client
  labels:
    {{- include "backend-go.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "backend-go.fullname" . }}
  body:
    maxSize: {{ dig "body" "maxSize" "10m" $settings }}
    timeout: {{ dig "body" "timeout" "60s" $settings }}
{{- end }}
