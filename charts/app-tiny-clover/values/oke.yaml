file-manager:
  enabled: true
  image:
    repository: ghcr.io/beaverhouse/tinyclover-file-manager
    tag: "11e2cce1"
  nameOverride: "file-manager"
  fullnameOverride: "file-manager"
  service:
    api:
      port: 8081
  resources: *common-resources
  livenessProbe: &file-manager-probe
    httpGet:
      path: /file-manager/v1/health
    periodSeconds: 120
  readinessProbe: *file-manager-probe
  externalSecret:
    enabled: true
    data:
      - *postgres-host
      - *postgres-user
      - *postgres-password
      - *jwt-keyfunc-url
      - secretKey: "S3_PUBLIC_ENDPOINT"
        remoteRef:
          key: "SUPABASE_S3_ENDPOINT"
      - secretKey: "S3_PUBLIC_ACCESS_KEY"
        remoteRef:
          key: "SUPABASE_S3_ACCESS_KEY_ID"
      - secretKey: "S3_PUBLIC_SECRET_KEY"
        remoteRef:
          key: "SUPABASE_S3_SECRET_ACCESS_KEY"
      - secretKey: "S3_PUBLIC_BUCKET_NAME"
        remoteRef:
          key: "SUPABASE_S3_PUBLIC_BUCKET"
      # Private S3 credentials are same as public because Supabase shares credentials between buckets
      - secretKey: "S3_PRIVATE_ENDPOINT"
        remoteRef:
          key: "SUPABASE_S3_ENDPOINT"
      - secretKey: "S3_PRIVATE_ACCESS_KEY"
        remoteRef:
          key: "SUPABASE_S3_ACCESS_KEY_ID"
      - secretKey: "S3_PRIVATE_SECRET_KEY"
        remoteRef:
          key: "SUPABASE_S3_SECRET_ACCESS_KEY"
      - secretKey: "S3_PRIVATE_BUCKET_NAME"
        remoteRef:
          key: "SUPABASE_S3_PRIVATE_BUCKET"
  httproute:
    <<: *api-route
    rules:
      - path:
          value: /file-manager/v1
        timeouts:
          request: 300s
          backendRequest: 300s
  clientSettings:
    enabled: true
    body:
      maxSize: 100m
      timeout: 300s
  envFrom:
    - secretRef:
        name: file-manager-secret
  extraEnv:
    - *go-env
