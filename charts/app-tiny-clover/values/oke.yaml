# OKE (Oracle Kubernetes Engine) cluster configuration
# Values equal to backend-go's defaults are left out.

# Gateway configuration (Phase 1: disabled, Phase 2: enabled)
gateway:
  enabled: true
global:
  imagePullSecrets:
    - name: ghcr-secret
# Blocks the services below share through YAML aliases.
common:
  resources: &common-resources
    limits:
      cpu: 50m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi
  secrets:
    - &postgres-host
      secretKey: "POSTGRES_HOST"
      remoteRef:
        key: "SUPABASE_POSTGRES_HOST"
    - &postgres-user
      secretKey: "POSTGRES_USER"
      remoteRef:
        key: "SUPABASE_POSTGRES_USER"
    - &postgres-password
      secretKey: "POSTGRES_PASSWORD"
      remoteRef:
        key: "SUPABASE_POSTGRES_PASSWORD"
    - &jwt-keyfunc-url
      secretKey: "SUPABASE_JWT_KEYFUNC_URL"
      remoteRef:
        key: "SUPABASE_JWT_KEYFUNC_URL"
  httproute: &api-route
    enabled: true
    parentRefs:
      - name: api-gateway
        sectionName: https-api
    hostnames:
      - api.tinyclover.com
    annotations:
      external-dns.kubernetes.io/set-identifier: "oke-cluster-gateway"
      external-dns.kubernetes.io/aws-weight: "100"
  timeouts: &default-timeouts
    request: 60s
    backendRequest: 60s
  env:
    - &go-env
      name: GO_ENV
      value: "production"
ae-analyzer:
  enabled: true
  image:
    repository: ghcr.io/beaverhouse/tinyclover-ae-analyzer
