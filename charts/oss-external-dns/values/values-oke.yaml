env:
  - name: AWS_DEFAULT_REGION
    value: ap-northeast-2
  - name: AWS_SHARED_CREDENTIALS_FILE
    value: /.aws/credentials

sources:
  - gateway-httproute

policy: sync

domainFilters:
  - "haulrest.me"
  - "tinyclover.com"

serviceAccount:
  create: true
  name: external-dns

extraArgs:
  - --aws-prefer-cname
  - --txt-prefix=oke-external-dns-
  # Keeps reading the external-dns.alpha.kubernetes.io/ annotations on the tiny-clover HTTPRoutes.
  # Remove it once they use external-dns.kubernetes.io/.
  - --enable-legacy-annotation-prefix

extraVolumeMounts:
  - name: aws-credentials
    mountPath: /.aws
    readOnly: true

extraVolumes:
  - name: aws-credentials
    secret:
      secretName: external-dns-aws-credentials
